name: Deploy personal website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ariakianzad.github.io' }}

      - name: Verify personal site and Mian-e-Ma assets
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          test -s out/404.html
          test -s out/Mian-e-Ma/index.html
          test -s out/Mian-e-Ma/styles.css
          test -s out/Mian-e-Ma/assets/Mian-e-Ma.pdf
          test -s out/Mian-e-Ma/assets/estedad-variable.woff2
          test -s out/Mian-e-Ma/assets/mian-e-ma-cover-v2.webp
          test -s out/Mian-e-Ma/assets/mian-e-ma-lineart.webp
          test -s out/Mian-e-Ma/assets/rexo-agency-logo-white.png
          ! grep -Fq 'مجله رکسو (RexoMag)' out/Mian-e-Ma/index.html
          ! grep -Fq 'class="publisher-mark"' out/Mian-e-Ma/index.html
          grep -Fq 'width="699" height="992"' out/Mian-e-Ma/index.html
          rm -f out/.htaccess out/_headers
          touch out/.nojekyll
          printf 'GitHub Pages artifact: %s files\\n' "$(find out -type f | wc -l)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
