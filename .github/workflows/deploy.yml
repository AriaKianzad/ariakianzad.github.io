name: Deploy personal website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Mian-e-Ma package
        shell: bash
        env:
          MIAN_PACKAGE_URL: 'https://uc9329068148453916b95856866e.dl.dropboxusercontent.com/cd/0/get/DMPEc9lmf6eC4QPPEewTy6PurbvFiO0Se5VxGzOkEH68IvNVn9q6n9Wq5oUebVfUov4NN2HhAV4D-Z0jgYILnV0Uzif44EG3jaXzpVZ_VRI9s9JdG3Pwa8KkiM49EHD78S8Sqs5JTrnruuTK3RbeIjoVVjOmzSB8KcBGQf6-Vz4d7g/file?c_luid=4d89e625'
        run: |
          set -euo pipefail
          if [ -n "${MIAN_PACKAGE_URL:-}" ]; then
            package_zip="$RUNNER_TEMP/Mian-e-Ma-GitHub-Overlay.zip"
            package_tmp="$RUNNER_TEMP/mian-e-ma-unpack"
            curl --fail --silent --show-error --location "$MIAN_PACKAGE_URL" --output "$package_zip"
            unzip -tq "$package_zip"
            mkdir -p "$package_tmp"
            unzip -q "$package_zip" -d "$package_tmp"
            package_dir="$package_tmp/Mian-e-Ma-GitHub-Overlay/public/Mian-e-Ma"
            test -s "$package_dir/index.html"
            test -s "$package_dir/styles.css"
            test -s "$package_dir/assets/Mian-e-Ma.pdf"
            mkdir -p public
            rm -rf public/Mian-e-Ma
            cp -a "$package_dir" public/Mian-e-Ma
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/Mian-e-Ma
            git commit -m "Publish Mian-e-Ma landing page and book"
            git push origin HEAD:main
            echo "Mian-e-Ma source files committed under public/Mian-e-Ma."
          else
            test -s public/Mian-e-Ma/index.html
            test -s public/Mian-e-Ma/styles.css
            test -s public/Mian-e-Ma/assets/Mian-e-Ma.pdf
            echo "Existing Mian-e-Ma source files are present."
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ariakianzad.github.io' }}

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          test -s out/404.html
          test -s out/Mian-e-Ma/index.html
          test -s out/Mian-e-Ma/assets/Mian-e-Ma.pdf
          rm -f out/.htaccess out/_headers
          touch out/.nojekyll
          printf 'GitHub Pages artifact: %s files\\n' "$(find out -type f | wc -l)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
