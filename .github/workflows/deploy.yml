name: Deploy personal website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job reads the repository; only the deploy job can publish Pages.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generated social icon map
        run: |
          npm run social-icons
          git diff --exit-code -- src/lib/social-icons.json

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check build scripts parse
        run: |
          node --check scripts/serve.mjs
          node --check scripts/strip-next-runtime.mjs
          node --check scripts/generate-assets.mjs
          node --check scripts/extract-social-paths.mjs
          node --check scripts/verify-export.mjs
          node --check scripts/make-hosting-bundle.mjs

      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ariakianzad.github.io' }}

      - name: Verify personal site, book page and sitemap
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ariakianzad.github.io' }}
        run: |
          set -euo pipefail
          test -s out/index.html
          grep -Fq '<meta name="google-site-verification" content="UhIDVQ1toOjgUhS7bONWQB-lmnoRW5gbZkI1ZRpjpo8"/>' out/index.html
          test -s out/404.html
          test -s out/sitemap.xml
          test -s out/robots.txt
          test -s out/llms.txt
          test -s out/Mian-e-Ma/index.html
          test -s out/Mian-e-Ma/styles.css
          test -s out/Mian-e-Ma/assets/Mian-e-Ma.pdf
          test -s out/Mian-e-Ma/assets/estedad-variable.woff2
          test -s out/Mian-e-Ma/assets/mian-e-ma-cover-v2.webp
          test -s out/Mian-e-Ma/assets/mian-e-ma-lineart.webp
          test -s out/Mian-e-Ma/assets/rexo-agency-logo-white.png
          test -s out/Mian-e-Ma/assets/rexo-mag-logo.png
          test -s out/Mian-e-Ma/assets/OFL.txt
          ! grep -Fq 'مجله رکسو (RexoMag)' out/Mian-e-Ma/index.html
          ! grep -Fq 'class="publisher-mark"' out/Mian-e-Ma/index.html
          grep -Fq '<title>دانلود رایگان کتاب «میانِ ما»؛ شناخت رابطه و مسئولیت‌پذیری عاطفی</title>' out/Mian-e-Ma/index.html
          grep -Fq '<h3>از شناخت خود و دیگری تا ساختن یک رابطۀ سالم و ماندگار</h3>' out/Mian-e-Ma/index.html
          grep -Fq 'width="699" height="992"' out/Mian-e-Ma/index.html
          grep -Fq "<loc>${NEXT_PUBLIC_SITE_URL%/}/Mian-e-Ma/</loc>" out/sitemap.xml

      - name: Smoke-test local static preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/serve.mjs 4173 > /tmp/aria-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /tmp/aria-book.html http://127.0.0.1:4173/Mian-e-Ma/
          grep -Fq 'میانِ ما' /tmp/aria-book.html
          PDF_TYPE="$(curl --fail --silent --head --output /dev/null --write-out '%{content_type}' http://127.0.0.1:4173/Mian-e-Ma/assets/Mian-e-Ma.pdf)"
          test "$PDF_TYPE" = "application/pdf"
          STATUS="$(curl --path-as-is --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4173/%2e%2e/%2e%2e/etc/passwd')"
          test "$STATUS" != "200"

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -f out/.htaccess out/_headers
          touch out/.nojekyll
          printf 'GitHub Pages artifact: %s files\n' "$(find out -type f | wc -l)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
