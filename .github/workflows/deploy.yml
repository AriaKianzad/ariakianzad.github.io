name: Deploy personal website to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The build job reads the repository; only the deploy job can publish Pages.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify complete brand logo image
        run: node scripts/verify-brand-logo.mjs

      - name: Verify generated brand favicon
        run: |
          npm run assets
          git diff --exit-code -- public/favicon.svg

      - name: Verify generated social icon map
        run: |
          npm run social-icons
          git diff --exit-code -- src/lib/social-icons.json

      - name: Scan repository for leaked credentials
        run: npm run check:security

      - name: Test credential scanner against synthetic tokens
        run: npm run test:security-scan

      - name: Test hosting build safety
        run: npm run test:build-safety

      - name: Test analytics consent states
        run: npm run test:consent

      - name: Test homepage redesign contract
        run: npm run test:homepage

      - name: Test Supabase security contract
        run: npm run test:supabase

      - name: Test Google Analytics and Search Console reporting
        run: npm run test:analytics

      - name: Test personal blog and CMS contracts
        run: npm run test:blog

      - name: Test professional blog editor
        run: npm run test:editor

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check all JavaScript and Node build scripts parse
        shell: bash
        run: |
          set -euo pipefail
          find scripts public -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -r -n1 node --check

      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ariakianzad.github.io' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '' }}

      - name: Verify personal site, book page and sitemap
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ariakianzad.github.io' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '' }}
        run: |
          set -euo pipefail
          test -s out/index.html
          grep -Fq '<meta name="google-site-verification" content="UhIDVQ1toOjgUhS7bONWQB-lmnoRW5gbZkI1ZRpjpo8"/>' out/index.html
          grep -Fq 'href="/favicon.svg' out/index.html
          grep -Fq 'href="/favicon.svg' out/blog/index.html
          grep -Fq 'href="/favicon.svg' out/Mian-e-Ma/index.html
          grep -Fq 'href="/favicon.svg' out/admin/index.html
          grep -Fq 'href="/favicon.svg' out/admin/blog/index.html
          test -s out/404.html
          test -s out/favicon.svg
          test -s out/brand-logo.png
          test -s out/icon.png
          test -s out/apple-icon.png
          test ! -e out/blog-favicon.svg
          test ! -e out/og/og.png
          test -s out/_hero/hero-visual.js
          test -d out/_hero/chunks
          find out/_hero/chunks -type f -name '*.js' -print -quit | grep -q .
          test -s out/sitemap.xml
          test -s out/robots.txt
          test -s out/llms.txt
          grep -Fq '<title>Aria Kianzad | Brand Strategy &amp; Personal Branding</title>' out/index.html
          grep -Fq 'Find the difference.' out/index.html
          grep -Fq 'Make it matter.' out/index.html
          grep -Fq 'hero-visual__fallback' out/index.html
          grep -Fq 'ProfilePage' out/index.html
          grep -Fq 'Person' out/index.html
          grep -Fq 'Personal branding' out/llms.txt
          test -s out/Mian-e-Ma/index.html
          test -s out/blog/index.html
          test -s out/blog-listing.js
          grep -Fq '/blog-listing.js' out/blog/index.html
          grep -Fq 'data-blog-search' out/blog/index.html
          grep -Fq 'data-blog-post-card' out/blog/index.html
          test -s out/blog/feed.xml
          test -s out/admin/blog/index.html
          test -s out/admin/blog/blog.css
          test -s out/admin/blog/app.js
          test -s out/admin/blog/editor-core.js
          grep -Fq 'editor-core.js' out/admin/blog/index.html
          grep -Fq 'ذخیرۀ خودکار' out/admin/blog/index.html
          grep -Fq 'آمار بازدید مقاله‌ها' out/admin/blog/index.html
          grep -Fq 'id="view-analytics"' out/admin/blog/index.html
          test -s out/admin/index.html
          test -s out/admin/admin.css
          test -s out/admin/app.js
          test -s out/admin/config.js
          grep -Fq 'http-equiv="Content-Security-Policy"' out/index.html
          grep -Fq 'http-equiv="Content-Security-Policy"' out/Mian-e-Ma/index.html
          grep -Fq 'http-equiv="Content-Security-Policy"' out/admin/index.html
          grep -Fq 'bkohdqwecnvbmeaiuyyx.supabase.co' out/admin/index.html
          grep -Fq 'ga4-title' out/admin/index.html
          grep -Fq 'gsc-title' out/admin/index.html
          grep -Fq 'blog-admin' out/admin/blog/app.js
          grep -Fq 'get_public_blog_payload' scripts/fetch-blog-content.mjs
          grep -Fq 'noindex, nofollow, noarchive' out/admin/blog/index.html
          node --check public/admin/blog/app.js
          node --check public/blog-listing.js
          grep -Fq 'site-analytics' out/admin/app.js
          grep -Fq 'remember-session' out/admin/index.html
          grep -Fq 'mian-e-ma-dashboard-refresh-v1' out/admin/app.js
          grep -Fq 'void restoreRememberedSession();' out/admin/app.js
          test -s out/analytics-consent.js
          grep -Fq 'analytics-consent' out/index.html
          grep -Fq '/analytics-consent.js' out/index.html
          grep -Fq 'analytics-consent' out/Mian-e-Ma/index.html
          grep -Fq '/analytics-consent.js' out/Mian-e-Ma/index.html
          grep -Fq 'noindex, nofollow, noarchive' out/admin/index.html
          node --check public/admin/app.js
          ! grep -Eq 'sb_secret_|service_role|ghp_' out/admin/config.js
          test -s out/Mian-e-Ma/styles.css
          test ! -e out/Mian-e-Ma/assets/Mian-e-Ma.pdf
          test -s out/Mian-e-Ma/assets/estedad-variable.woff2
          test -s out/Mian-e-Ma/assets/mian-e-ma-cover-v2.webp
          test -s out/Mian-e-Ma/assets/mian-e-ma-lineart.webp
          test -s out/og/og.jpg
          test -s out/Mian-e-Ma/assets/mian-e-ma-social-preview.jpg
          test -s out/Mian-e-Ma/assets/rexo-agency-logo-white.png
          test -s out/Mian-e-Ma/assets/OFL.txt
          grep -Fq 'href="/favicon.svg' out/Mian-e-Ma/index.html
          grep -Fq 'href="/icon.png' out/Mian-e-Ma/index.html
          grep -Fq 'href="/apple-icon.png' out/Mian-e-Ma/index.html
          test "$(grep -c 'http-equiv="Content-Security-Policy"' out/Mian-e-Ma/index.html)" -eq 1
          ! grep -R -Fq 'rexo-mag-logo.png' out/Mian-e-Ma/
          ! grep -Fq 'مجله رکسو (RexoMag)' out/Mian-e-Ma/index.html
          ! grep -Fq 'class="publisher-mark"' out/Mian-e-Ma/index.html
          grep -Fq '<title>کتاب میانِ ما؛ شناخت رابطه، صمیمیت و مسئولیت‌پذیری عاطفی</title>' out/Mian-e-Ma/index.html
          grep -Fq '<h3>از شناخت خود و دیگری تا ساختن یک رابطۀ سالم و ماندگار</h3>' out/Mian-e-Ma/index.html
          grep -Fq 'width="699" height="992"' out/Mian-e-Ma/index.html
          if [[ -n "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}" ]]; then
            grep -Fq "data-sitekey=\"${NEXT_PUBLIC_TURNSTILE_SITE_KEY}\"" out/blog/contact/index.html
          fi
          grep -Fq "<loc>${NEXT_PUBLIC_SITE_URL%/}/Mian-e-Ma/</loc>" out/sitemap.xml

      - name: Smoke-test local static preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/serve.mjs 4173 > /tmp/aria-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /tmp/aria-book.html http://127.0.0.1:4173/Mian-e-Ma/
          grep -Fq 'میانِ ما' /tmp/aria-book.html
          PDF_STATUS="$(curl --path-as-is --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4173/Mian-e-Ma/assets/Mian-e-Ma.pdf)"
          test "$PDF_STATUS" = "404"
          STATUS="$(curl --path-as-is --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4173/%2e%2e/%2e%2e/etc/passwd')"
          test "$STATUS" != "200"

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -f out/.htaccess out/_headers
          touch out/.nojekyll
          printf 'GitHub Pages artifact: %s files\n' "$(find out -type f | wc -l)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
