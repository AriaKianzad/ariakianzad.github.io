name: Temporary publish of Mian-e-Ma PDF release

on:
  push:
    paths:
      - ".mian-e-ma-release-trigger"

permissions:
  contents: write

concurrency:
  group: publish-mian-e-ma-pdf-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub Release and upload the PDF asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const tag = "mian-e-ma-v1";
          const assetName = "Mian-e-Ma.pdf";
          const filePath = "public/Mian-e-Ma/assets/Mian-e-Ma.pdf";
          const api = `https://api.github.com/repos/${repository}`;
          const headers = {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json"
          };

          async function request(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const text = await response.text();
            let body;
            try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text }; }
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          async function main() {
            if (!fs.existsSync(filePath)) throw new Error(`PDF not found: ${filePath}`);
            const pdf = fs.readFileSync(filePath);
            if (pdf.length < 1000000) throw new Error(`Unexpected PDF size: ${pdf.length} bytes`);

            let release;
            try {
              release = await request(`${api}/releases/tags/${tag}`);
            } catch (error) {
              if (!String(error.message).includes("GitHub API 404")) throw error;
              release = await request(`${api}/releases`, {
                method: "POST",
                body: JSON.stringify({
                  tag_name: tag,
                  target_commitish: "main",
                  name: "میانِ ما | نسخه PDF",
                  body: "نسخۀ PDF کتاب «میانِ ما»\n\nاین Release برای میزبانی فایل اصلی کتاب و ثبت تعداد دانلودهای آن منتشر شده است.",
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  make_latest: "true"
                })
              });
            }

            const existing = (release.assets || []).find(asset => asset.name === assetName);
            if (existing) {
              console.log(`The release already has ${assetName}: ${existing.browser_download_url} (downloads: ${existing.download_count})`);
              return;
            }

            const uploadUrl = release.upload_url.split("{")[0] + `?name=${encodeURIComponent(assetName)}`;
            const response = await fetch(uploadUrl, {
              method: "POST",
              headers: {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
                "Content-Type": "application/pdf"
              },
              body: pdf
            });
            const text = await response.text();
            let asset;
            try { asset = text ? JSON.parse(text) : {}; } catch { asset = { raw: text }; }
            if (!response.ok) throw new Error(`Asset upload failed (${response.status}): ${JSON.stringify(asset)}`);

            console.log(JSON.stringify({
              release_url: release.html_url,
              tag_name: release.tag_name,
              asset_name: asset.name,
              asset_size: asset.size,
              browser_download_url: asset.browser_download_url,
              download_count: asset.download_count
            }, null, 2));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
