name: Validate scoped dependency security update

on:
  push:
    branches:
      - security/minimatch-11-overrides

permissions:
  contents: read

concurrency:
  group: minimatch-security-update
  cancel-in-progress: true

jobs:
  validate-and-lock:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Resolve and write the patched dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install the exact lockfile
        run: npm ci

      - name: Confirm no known npm advisories remain
        run: npm audit --audit-level=low

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Scan for accidental credentials
        run: npm run check:security

      - name: Build and verify the static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ariakianzad.github.io

      - name: Commit the regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json was already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): lock patched minimatch 11 for lint tooling"
          git push origin "HEAD:${GITHUB_REF_NAME}"
