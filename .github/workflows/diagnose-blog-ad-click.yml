name: Diagnose blog ad-click endpoint

on:
  push:
    branches:
      - fix/blog-ad-click-counter

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check CORS preflight
        shell: bash
        env:
          SUPABASE_URL: https://bkohdqwecnvbmeaiuyyx.supabase.co
          SITE_ORIGIN: https://ariakianzad.github.io
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request OPTIONS \
            --header "Origin: ${SITE_ORIGIN}" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: apikey,content-type" \
            --dump-header /tmp/cors-headers \
            --output /dev/null \
            "${SUPABASE_URL}/functions/v1/blog-ad-click"
          tr -d '\r' < /tmp/cors-headers | grep -qi "^access-control-allow-origin: ${SITE_ORIGIN}$"
          tr -d '\r' < /tmp/cors-headers | grep -Eqi '^access-control-allow-headers:.*apikey.*content-type'
          echo "CORS preflight accepted."

      - name: Check public click endpoint without incrementing a real banner
        shell: bash
        env:
          SUPABASE_URL: https://bkohdqwecnvbmeaiuyyx.supabase.co
          SITE_ORIGIN: https://ariakianzad.github.io
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_FZBK8LPOyf2nAtS8jhchUw_3SVXvo6h
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/click-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Origin: ${SITE_ORIGIN}" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{"banner_id":"banner-999999"}' \
            "${SUPABASE_URL}/functions/v1/blog-ad-click")"
          cat /tmp/click-response.json
          test "${status}" = "202"
          node -e 'const fs=require("node:fs");const body=JSON.parse(fs.readFileSync("/tmp/click-response.json","utf8"));if(body.ok!==true||body.counted!==false)process.exit(1)'
          echo "Click endpoint accepted the request and safely ignored the unconfigured test banner."
