name: Verify live banner click counting once

on:
  push:
    branches:
      - test/verify-live-banner-click-20261125

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Register one click on the active banner through the same no-preflight route
        shell: bash
        env:
          SUPABASE_URL: https://bkohdqwecnvbmeaiuyyx.supabase.co
          SITE_ORIGIN: https://ariakianzad.github.io
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/click-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Origin: ${SITE_ORIGIN}" \
            --header 'Content-Type: text/plain;charset=UTF-8' \
            --data '{"banner_id":"banner-1"}' \
            "${SUPABASE_URL}/functions/v1/blog-ad-click")"
          cat /tmp/click-response.json
          test "${status}" = "202"
          node -e 'const fs=require("node:fs");const body=JSON.parse(fs.readFileSync("/tmp/click-response.json","utf8"));if(body.ok!==true||body.counted!==true)process.exit(1)'
          echo "The active banner click was recorded."
