# Supabase runtime configuration for the website, blog CMS and analytics.
#
# The three admin-only functions validate the Supabase access token with Auth,
# require a confirmed email and check the active dashboard_admins allowlist.
# blog-contact is intentionally public and uses Origin, input, honeypot,
# rate-limit and secret-relay checks instead. Keep each model in its handler.

[functions.download-stats]
verify_jwt = false

[functions.site-analytics]
verify_jwt = false

[functions.blog-admin]
verify_jwt = false

[functions.blog-contact]
verify_jwt = false
