# Supabase project configuration for the Mian-e-Ma analytics dashboard.
#
# Admin routes verify Supabase sessions, confirmed email and the dashboard_admins
# allowlist inside their handlers. Public routes enforce their own Origin and
# request validation and must not require a user JWT.

[functions.download-stats]
verify_jwt = false

[functions.site-analytics]
verify_jwt = false

[functions.blog-admin]
verify_jwt = false

[functions.blog-contact]
verify_jwt = false

[functions.blog-ad-click]
verify_jwt = false
